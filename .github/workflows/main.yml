name: Deploy SwedenStart to Vercel

on:
     push:
          branches:
               - main

permissions:
     contents: read

concurrency:
     group: swedenstart-production
     cancel-in-progress: false

jobs:
     deploy:
          runs-on: ubuntu-latest
          steps:
               - name: Check out repository
                 uses: actions/checkout@v4

               - name: Set up Node.js
                 uses: actions/setup-node@v4
                 with:
                      node-version: 22

               - name: Install Vercel CLI
                 run: npm install --global vercel@latest

               - name: Prepare Vercel project link and container entrypoint
                 env:
                      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
                      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
                 run: |
                      set -euo pipefail
                      test -n "$VERCEL_ORG_ID"
                      test -n "$VERCEL_PROJECT_ID"
                      mkdir -p .vercel
                      printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
                      cp Dockerfile Dockerfile.vercel

               - name: Deploy production container to Vercel
                 id: deploy
                 env:
                      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                 run: |
                      set -euo pipefail
                      test -n "$VERCEL_TOKEN"
                      deployment_url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
                      echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
                      echo "Production deployment: $deployment_url"

               - name: Verify deployed app and Supabase connectivity
                 env:
                      DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
                 run: |
                      set -euo pipefail
                      for attempt in {1..12}; do
                        if response="$(curl --silent --show-error --fail "$DEPLOYMENT_URL/api/health")"; then
                          if jq -e '(.status == "Healthy" or .Status == "Healthy") and (.database == "Healthy" or .Database == "Healthy")' <<< "$response" >/dev/null; then
                            echo "Deployment health check passed."
                            exit 0
                          fi
                          echo "Health endpoint responded, but the app or database is unhealthy."
                        else
                          echo "Health endpoint is not ready yet (attempt $attempt/12)."
                        fi
                        sleep 10
                      done
                      echo "Deployment did not become healthy at $DEPLOYMENT_URL/api/health" >&2
                      exit 1
