<section class="register-page">
  <div class="register-layout">
    <div class="hero">
      <span class="hero-badge">Sweden Start</span>

      <h1>Welcome back</h1>

      <p>
        Sign in to continue your journey in Sweden and access your personalized
        roadmap.
      </p>

      <div class="hero-features">
        <div>
          <i class="pi pi-map"></i>
          <span>Continue your roadmap</span>
        </div>

        <div>
          <i class="pi pi-home"></i>
          <span>Housing resources</span>
        </div>

        <div>
          <i class="pi pi-briefcase"></i>
          <span>Career guidance</span>
        </div>
      </div>
    </div>

    <p-card class="login-card">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label>Email</label>

          <input
            pInputText
            type="email"
            formControlName="email"
            placeholder="name@example.com" />
        </div>

        <div class="field">
          <label>Password</label>

          <p-password
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            placeholder="Enter your password"
            styleClass="w-full"
            inputStyleClass="w-full">
          </p-password>
        </div>

        @if (errorMessage) {
          <small class="error-message">
            {{ errorMessage }}
          </small>
        }

        <p-button
          type="submit"
          label="Log in"
          [loading]="isSubmitting"
          styleClass="login-btn">
        </p-button>

        <p class="footer-text">
          Don't have an account?
          <a routerLink="/register">Create one</a>
        </p>
      </form>
    </p-card>
  </div>
</section>
