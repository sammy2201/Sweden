<section class="explore-page">
  <div class="mb-5">
    <p-tag severity="secondary" value="Discover nearby trips"></p-tag>

    <h1 class="mt-3 mb-2">Explore Sweden</h1>

    <p class="text-color-secondary mt-0">
      Pick a county, discover newcomer-friendly places, and plan how to get
      there by public transport.
    </p>
  </div>

  <div class="grid">
    @for (county of counties$ | async; track county.id) {
      <div class="col-12 sm:col-6 lg:col-4 xl:col-3">
        <a class="county-link" [routerLink]="['/explore', county.id]">
          <p-card styleClass="h-full overflow-hidden">
            <ng-template pTemplate="header">
              <img
                class="county-image"
                [src]="county.bannerImageUrl"
                [alt]="county.name" />
            </ng-template>

            <div class="flex flex-column gap-3">
              <div>
                <h2 class="m-0 text-xl">{{ county.name }}</h2>

                <p class="text-color-secondary line-height-3 mt-2 mb-0">
                  {{ county.description }}
                </p>
              </div>

              <div class="flex justify-content-between align-items-center gap-3">
                <p-tag
                  severity="info"
                  [value]="county.featuredAttractionCount + ' places'">
                </p-tag>

                <p-button
                  icon="pi pi-arrow-right"
                  rounded
                  text
                  severity="secondary"
                  ariaLabel="Open county">
                </p-button>
              </div>
            </div>
          </p-card>
        </a>
      </div>
    }
  </div>
</section>
