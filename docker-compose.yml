services:
  postgres:
    image: postgres:16-alpine
    container_name: sweden-start-postgres
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    cpus: ${POSTGRES_CPUS:-1.0}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - autovacuum_work_mem=16MB
      - -c
      - max_connections=10
      - -c
      - effective_cache_size=128MB
      - -c
      - max_wal_size=256MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sweden_start}
      POSTGRES_USER: ${POSTGRES_USER:-sweden_start}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sweden_start_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
